plugins {
    id 'com.android.application'
}

android {
    namespace 'app.driftcast'
    compileSdk 35

    defaultConfig {
        applicationId 'app.driftcast'
        minSdk 21
        targetSdk 35
        versionCode 4
        versionName '0.3.0'
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled false
            // Signed with the debug key so the APK installs without extra setup.
            // Replace with your own keystore before publishing to Google Play.
            signingConfig signingConfigs.debug
        }
    }

    lint {
        // CI runs lintRelease to catch Android APIs that are newer than minSdk (old TVs)
        checkOnly 'NewApi'
        abortOnError true
        checkReleaseBuilds false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
